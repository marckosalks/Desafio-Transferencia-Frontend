<div class="topbar">
    <div class="topbar-title">
        <i class="ti ti-transfer" aria-hidden="true" style="font-size:20px;color:#185FA5"></i>
        Transferências
    </div>
    <div class="tabs">
        <button class="tab" style="background-color: #C5AA4D; border-color: #C5AA4D; color: #fff;"
            onclick="showTab('extrato', this)">
            <i class="ti ti-list" aria-hidden="true"></i> Extrato
        </button>
    </div>
</div>


<div class="card-title">Nova transferência</div>

<div class="container-cards">


    <form [formGroup]="transferenciaForm" (ngSubmit)="agendar()" class="card">

        <div class="form-grid">

            <div class="form-group">
                <label for="origem">Conta de origem</label>
                <input id="origem" type="text" mask="00000000-0" [dropSpecialCharacters]="false"
                    placeholder="00000000-0" formControlName="contaOrigem">
            </div>

            <div class="form-group">
                <label for="destino">Conta de destino</label>
                <input id="destino" type="text" mask="00000000-0" [dropSpecialCharacters]="false"
                    placeholder="00000000-0" formControlName="contaDestino">
            </div>

            <div class="form-group">
                <label for="valor">Valor (R$)</label>
                <input id="valor" type="text" mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
                    placeholder="R$ 0,00" formControlName="valor">
            </div>

            <div class="form-group">
                <label for="dataTransf">Data de transferência</label>
                <input id="dataTransf" type="date" formControlName="dataTransferencia">
            </div>
        </div>

        <div class="alert" *ngIf="erroTaxa">
            <i class="ti ti-alert-circle"></i>
            <span>{{ mensagemErro }}</span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="transferenciaForm.invalid"
            style="background-color: #00826b; border-color: #00826b; color: #fff;">

            <i class="ti ti-check"></i>
            Confirmar agendamento

        </button>

    </form>

    <div class="card">
        <table class="taxa-table">
            <thead>
                <tr>
                    <th>Dias</th>
                    <th>Taxa Fixa</th>
                    <th>Percentual</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>0</td>
                    <td>R$ 3,00</td>
                    <td>2,5%</td>
                </tr>
                <tr>
                    <td>1 - 10</td>
                    <td>R$ 12,00</td>
                    <td>0%</td>
                </tr>
                <tr>
                    <td>11 - 20</td>
                    <td>R$ 0,00</td>
                    <td>8,2%</td>
                </tr>
                <tr>
                    <td>21 - 30</td>
                    <td>R$ 0,00</td>
                    <td>6,9%</td>
                </tr>
                <tr>
                    <td>31 - 40</td>
                    <td>R$ 0,00</td>
                    <td>4,7%</td>
                </tr>
                <tr>
                    <td>41 - 50</td>
                    <td>R$ 0,00</td>
                    <td>1,7%</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
